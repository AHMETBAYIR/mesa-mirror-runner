name: Mirror mesa daily

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: "0 3 * * *"
  # Allows manual trigger from the Actions tab
  workflow_dispatch:

# Never run two mirror jobs at once (avoids races on cache save)
concurrency:
  group: mesa-mirror
  cancel-in-progress: false

env:
  # The repo that receives the full mirror (default branch there = mesa's main)
  MIRROR_REPO: AHMETBAYIR/mesa-mirror
  # Upstream source
  UPSTREAM: https://gitlab.freedesktop.org/mesa/mesa.git

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Restore cached bare mirror (if any)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: mirror.git
          key: mesa-mirror-${{ github.run_id }}
          restore-keys: |
            mesa-mirror-

      - name: Clone or incrementally update the mirror
        run: |
          set -euo pipefail
          if [ -f mirror.git/HEAD ]; then
            echo "Existing mirror found, fetching incrementally..."
            git --git-dir=mirror.git remote set-url origin "$UPSTREAM"
            git --git-dir=mirror.git fetch --prune origin "+refs/*:refs/*"
          else
            echo "No cached mirror, doing a fresh full clone (first run only)..."
            git clone --mirror "$UPSTREAM" mirror.git
          fi
          git --git-dir=mirror.git rev-parse HEAD || true

      - name: Push all refs to GitHub
        env:
          # MIRROR_TOKEN needs the `workflow` scope because mesa's history
          # contains .github/workflows/*.yml files (GITHUB_TOKEN can't push those).
          URL: https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/${{ env.MIRROR_REPO }}.git
        run: |
          set -euo pipefail
          cd mirror.git
          # Buffer large packs in memory and avoid flaky HTTP/2 handling for big pushes
          git config http.postBuffer 2147483648
          git config http.version HTTP/1.1

          # Retry transient GitHub 408/500 errors
          push_with_retry() {
            local attempt=1
            until git push --force "$URL" "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::push failed after 3 attempts: $*"
                return 1
              fi
              attempt=$(( attempt + 1 ))
              echo "Retrying in 15s (attempt $attempt)..."
              sleep 15
            done
          }

          # --mirror pushes all refs (branches + tags) and prunes deleted upstream
          # refs; it also force-updates. Succeeds quickly once everything exists.
          if git push --mirror "$URL"; then
            echo "Full mirror push succeeded"
            exit 0
          fi

          echo "::notice::One-shot push failed — falling back to batched push"
          echo "(needed only during the first-ever sync; later daily syncs are small)"

          # 1) Push main's history in slices so no single HTTP request is huge.
          mapfile -t commits < <(git rev-list --reverse main)
          total=${#commits[@]}
          chunk=5000
          i=0
          while [ "$i" -lt "$total" ]; do
            end=$(( i + chunk - 1 ))
            [ "$end" -ge "$total" ] && end=$(( total - 1 ))
            echo "Pushing commits $((i+1))..$((end+1)) of $total"
            push_with_retry "+${commits[$end]}:refs/heads/main"
            i=$(( i + chunk ))
          done

          # 2) Push every other branch individually (old release branches carry
          #    unique backport history not reachable from main).
          git for-each-ref --format='%(refname)' refs/heads | while read -r r; do
            [ "$r" = "refs/heads/main" ] && continue
            echo "Pushing branch $r"
            push_with_retry "+$r:$r"
          done

          # 3) Push tags in batches of 100 (952 tags in one request is too much).
          git for-each-ref --format='%(refname)' refs/tags > /tmp/tags.txt
          split -l 100 /tmp/tags.txt /tmp/tagbatch_
          for f in /tmp/tagbatch_*; do
            refs=()
            while read -r r; do refs+=("+$r:$r"); done < "$f"
            echo "Pushing batch $f (${#refs[@]} tags)"
            push_with_retry "${refs[@]}"
          done
          rm -f /tmp/tagbatch_*

          # 4) Final prune pass: drop refs deleted upstream (best-effort; the
          #    next daily run's one-shot push prunes anyway).
          git push --mirror "$URL" || echo "::warning::prune pass skipped for now"
          echo "Batched push complete"

      - name: Disable upstream CI workflows in the mirror
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ env.MIRROR_REPO }}"
          # Mesa's workflows (e.g. macos.yml, on: push) would run pointlessly on
          # every sync. The mirror repo should run no workflows at all.
          gh api "repos/$REPO/actions/workflows" --paginate \
            --jq '.workflows[] | .id' \
            | while read -r id; do
                echo "Disabling workflow id $id"
                gh api -X PUT "repos/$REPO/actions/workflows/$id/disable" || true
              done

      - name: Save mirror to cache
        if: always() && hashFiles('mirror.git/HEAD') != ''
        uses: actions/cache/save@v4
        with:
          path: mirror.git
          key: mesa-mirror-${{ github.run_id }}